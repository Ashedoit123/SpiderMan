services:
  # Option 1: Static Site (Fastest, 100% Free, Global CDN)
  - type: web
    name: spiderman-web-shooter
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
